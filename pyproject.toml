[project]
name = "overopt"
version = "0.1.0"
description = "Reproduction of Gao, Schulman & Hilton (2023), Scaling Laws for Reward Model Overoptimization"
requires-python = ">=3.12,<3.13"

dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.15",
    "matplotlib>=3.10",
    "pyyaml>=6.0",
]

[dependency-groups]

gen = [
    "vllm>=0.26",
    # quack 0.5.0 targets cutlass-dsl 4.5.x (ThrMma); vLLM pins 4.6.0, which removed it
    "quack-kernels>=0.6.0",
    "torch>=2.11",
    "transformers>=5.7",
    "trl>=1.9",
    "accelerate>=1.14",
    "datasets>=5.0",
    "wandb>=0.28.1",
]

rl = ["openrlhf[vllm]>=0.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/overopt"]

[tool.uv]
conflicts = [[{ group = "gen" }, { group = "rl" }]]

[tool.uv.extra-build-dependencies]
flash-attn = ["torch"]
